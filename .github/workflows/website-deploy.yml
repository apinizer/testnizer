name: Deploy website to GitHub Pages

# Monorepo website deploy — builds the Astro site in `website/` and publishes it
# to GitHub Pages (custom domain www.testnizer.com, served from this repo's
# Pages with "GitHub Actions" as the source; the domain was migrated here from
# the now-retired apinizer/testnizer-website).
#
# Live and fully automatic: it deploys on push to website/**, on the
# repository_dispatch from build.yml after a release publishes, on the daily
# safety-net cron, and on manual workflow_dispatch.

on:
  workflow_dispatch:
  # Site changes deploy on their own; app-only changes don't (path filter).
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-deploy.yml']
  # Fired by build.yml after a release is published, so the /download page
  # picks up the new version + asset URLs.
  repository_dispatch:
    types: [testnizer-release-published]
  # Safety net: a missed dispatch won't strand the site on a stale version.
  schedule:
    - cron: '17 6 * * *'

# Least privilege (issue #296): read-only by default. Only the deploy job gets
# the Pages scopes; the build job (which runs npm ci with install scripts)
# stays read-only.
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Checkout + public release-metadata reads during the Astro build.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # The build fetches the latest release metadata from the GitHub API;
        # GITHUB_TOKEN dodges the 60/hr anonymous rate limit (public-read only).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages: pages: write to create the deployment, id-token: write for
    # the OIDC token that proves the deployment comes from this workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
