<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy for the renderer. This is a desktop app that
      must never connect to the open internet from the renderer process —
      all network traffic flows through the main process via IPC. We therefore
      forbid `connect-src` to anywhere.

      NOTE: `frame-ancestors` is deliberately absent. Browsers IGNORE it when it
      arrives via a <meta> element (it is header-only) and log a console error
      saying so on every load — which the screen-error tripwire in the E2E suite
      correctly flags. It was doing nothing here; embedding protection for a
      packaged desktop app comes from the window itself, not from this tag.
      Monaco Editor needs `blob:` workers
      and inline styles, and the app uses inline styles via Tailwind and
      Zustand hydration, so `'unsafe-inline'` is kept for styles only.
      `'unsafe-eval'` is required so user-authored pre-request and
      post-response scripts can execute via `new Function()` (test-runner.ts).
      `frame-src`/`media-src` allow `blob:` so the response viewer can preview
      binary bodies (PDF in an iframe, audio/video) from in-memory object URLs
      built off the base64 body — local only, no network egress (issue #25).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Testnizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
